name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"   # redraw once a day
  workflow_dispatch:       # run by hand from the Actions tab
  push:
    branches: [main]
    paths:                 # only when the graph's own settings change (its output commit does not retrigger it)
      - ".github/workflows/profile-3d.yml"
      - ".github/profile-3d-red.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-red.json
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution graph"; then
            git push
          fi
