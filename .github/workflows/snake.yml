name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # redraw once a day
  workflow_dispatch:      # lets you run it by hand from the Actions tab
  push:
    branches: [main]      # also rebuild whenever the profile is updated

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Minex101
          outputs: |
            dist/github-snake.svg?color_snake=#E50914&color_dots=#ebedf0,#F5A3A6,#E8636A,#B20710,#831010
            dist/github-snake-dark.svg?color_snake=#E50914&color_dots=#161b22,#5C0A0E,#831010,#B20710,#E50914
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
